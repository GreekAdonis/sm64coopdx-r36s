name: Build R36S

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths-ignore:
      - 'README.md'
      - 'BUILDING.md'
      - 'docs/**'
  pull_request:
    branches: [ main ]
  release:
    types: [ published ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Build and package
        run: |
          docker run --rm --platform linux/arm64 \
            -v "$PWD":/build -w /build debian:bullseye bash -lc '
            set -e
            export DEBIAN_FRONTEND=noninteractive
            apt-get update
            apt-get install -y --no-install-recommends \
              build-essential python3 libglew-dev libsdl2-dev libz-dev \
              libcurl4-openssl-dev bsdmainutils file binutils zip
            make HANDHELD=1 DISCORD_SDK=0 UPDATER=0 \
              EXTRA_CPP_FLAGS="-std=c++17" -j$(nproc)
            file build/us_pc/sm64coopdx.arm
            if ! file build/us_pc/sm64coopdx.arm | grep -q "ARM aarch64"; then
              echo "ERROR: build output is not an aarch64 binary" >&2
              exit 1
            fi
            echo "--- glibc requirements ---"
            max=$(readelf --version-info build/us_pc/sm64coopdx.arm \
              | grep -oE "GLIBC_2\.[0-9]+" | sed 's/GLIBC_//' \
              | sort -u | sort -V | tail -1)
            echo "max glibc required: $max"
            if [ "$(printf "%s\n" 2.30 "$max" | sort -V | tail -1)" != "2.30" ]; then
              echo "ERROR: binary requires glibc newer than the R36S userspace ($max)" >&2
              exit 1
            fi
            echo "--- packaging ---"
            rm -rf /tmp/dist
            mkdir -p /tmp/dist/sm64coopdx
            cd build/us_pc
            zip -qr /tmp/dist/sm64coopdx/files.zip dynos lang mods palettes
            mv sm64coopdx.arm /tmp/dist/sm64coopdx/sm64coopdx.aarch64
            cd /build
            cp -r port/sm64coopdx/. /tmp/dist/sm64coopdx/
            cp "port/Super Mario 64 Co-op DX.sh" /tmp/dist/
            cd /tmp/dist && zip -qr /build/sm64coopdx_r36s.zip .
          '

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sm64coopdx-r36s
          path: sm64coopdx_r36s.zip

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: sm64coopdx_r36s.zip